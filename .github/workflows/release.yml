name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The tag is the source of truth; refuse to ship if the package version
      # drifted from it (e.g. tagged v1.0.1 while pyproject still says 1.0.0).
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag != pyproject version $pkg" >&2
            exit 1
          fi

      - run: pip install build cyclonedx-bom
      - run: python -m build

      - name: Provenance — SBOM + checksums
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # SBOM of the *shipped* runtime tree only: a throwaway venv with just the
          # package and its install_requires, so dev/test deps never leak in.
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --quiet .
          cyclonedx-py environment /tmp/sbomenv -o "dist/stagy-${tag}.cdx.json"
          # SHA-256 over every artifact (wheel, sdist, SBOM) — not the sums file.
          (cd dist && sha256sum stagy-* > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
