server {
    listen 80;
    server_name _;

    # Everything under /api is proxied to the API container over the compose
    # network. Because the browser only ever talks to this origin, the whole
    # app is same-origin and CORS never enters the picture in this topology.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MUST exceed the API's 16 MB upload cap, or nginx returns its own 413
        # before the request ever reaches the API's (friendlier) size check.
        client_max_body_size 20m;

        # Steganalysis on a large cover can take a few seconds in the API's
        # threadpool; the default 60s proxy timeout is comfortably enough.
        proxy_read_timeout 120s;
    }

    # SPA: serve the file if it exists, else hand back index.html so client-side
    # state (the active tab) survives a refresh.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
